<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pico 2 W Weather Station</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --accent-temp: #ff5722;
            --accent-hum: #2196f3;
            --accent-pres: #4caf50;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: bold;
            background-color: #e0e0e0;
        }
        .status-online { background-color: #c8e6c9; color: #256029; }
        .status-loading { background-color: #fff9c4; color: #b78103; }
        
        /* Grid of Metric Cards */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-top: 5px solid #ccc;
            text-align: center;
        }
        .card.temp { border-top-color: var(--accent-temp); }
        .card.hum { border-top-color: var(--accent-hum); }
        .card.pres { border-top-color: var(--accent-pres); }
        
        .card h3 { margin: 0 0 10px 0; color: #666; font-size: 0.9rem; text-transform: uppercase; }
        .card .value { font-size: 2.2rem; font-weight: bold; margin-bottom: 5px; }
        .card .unit { font-size: 1rem; color: #888; }
        
        /* Data Table Styles */
        .table-container {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .table-header {
            padding: 15px 20px;
            background: #fafafa;
            border-bottom: 1px solid #eee;
            font-weight: bold;
        }
        .scroll-area {
            max-height: 300px;
            overflow-y: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td { padding: 12px 20px; border-bottom: 1px solid #eee; }
        th { background: #f9f9f9; position: sticky; top: 0; color: #666; font-size: 0.9rem; }
        tr:hover { background: #f5f5f5; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🌤️ Pico 2 W Weather Station</h1>
        <p>Last Sync Check: <span id="last-update">Never</span></p>
        <div id="status" class="status-badge status-loading">Loading Data...</div>
    </header>

    <!-- Latest Values Live Cards -->
    <div class="grid">
        <div class="card temp">
            <h3>Temperature</h3>
            <div class="value"><span id="curr-temp">--.-</span><span class="unit">°C</span></div>
        </div>
        <div class="card hum">
            <h3>Humidity</h3>
            <div class="value"><span id="curr-hum">--.-</span><span class="unit">%</span></div>
        </div>
        <div class="card pres">
            <h3>Barometric Pressure</h3>
            <div class="value"><span id="curr-pres">----.-</span><span class="unit"> hPa</span></div>
        </div>
    </div>

    <!-- History Table -->
    <div class="table-container">
        <div class="table-header">📊 Historical Data Logs</div>
        <div class="scroll-area">
            <table>
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Temperature (°C)</th>
                        <th>Humidity (%)</th>
                        <th>Pressure (hPa)</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr>
                        <td colspan="4" style="text-align:center; color:#999;">No historical logs found yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // ⚠️ CONFIGURATION - Make sure this exactly points to your live pages link!
    const DATA_URL = "https://bwzer.github.io/data.json";

    async function fetchWeatherData() {
        const statusBadge = document.getElementById('status');
        const timestampLabel = document.getElementById('last-update');
        
        timestampLabel.innerText = new Date().toLocaleTimeString();

        try {
            // Cache busting trick (?t=...) forces browser to ignore old saves and pull newest file
            const response = await fetch(`${DATA_URL}?t=${new Date().getTime()}`);
            
            if (!response.ok) {
                throw new Error(`HTTP error! Status: ${response.status}`);
            }

            const rawText = await response.text();
            
            // 🌟 Safety Handler: Check if GitHub is rebuilding an empty file
            if (!rawText || rawText.trim() === "" || rawText.trim() === "[]") {
                statusBadge.innerText = "⏳ JSON file building on GitHub...";
                statusBadge.className = "status-badge status-loading";
                return;
            }

            // Parse text array safely
            const dataArray = JSON.parse(rawText);
            
            if (!Array.isArray(dataArray) || dataArray.length === 0) {
                statusBadge.innerText = "⚠️ Invalid Data Structure";
                return;
            }

            // Success state update
            statusBadge.innerText = "● Live Connected";
            statusBadge.className = "status-badge status-online";

            // 1. Get Latest Reading (The final index in your Python appended array)
            const latest = dataArray[dataArray.length - 1];
            document.getElementById('curr-temp').innerText = latest.temperature.toFixed(2);
            document.getElementById('curr-hum').innerText = latest.humidity.toFixed(2);
            document.getElementById('curr-pres').innerText = latest.pressure.toFixed(2);

            // 2. Build History Table Rows (Reversed so the newest entries are at the top)
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = ""; // Clear placeholders

            const reversedData = [...dataArray].reverse();
            reversedData.forEach(entry => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${entry.timestamp || 'N/A'}</td>
                    <td style="color:var(--accent-temp); font-weight:bold;">${entry.temperature?.toFixed(2)} °C</td>
                    <td style="color:var(--accent-hum); font-weight:bold;">${entry.humidity?.toFixed(2)} %</td>
                    <td style="color:var(--accent-pres); font-weight:bold;">${entry.pressure?.toFixed(2)} hPa</td>
                `;
                tbody.appendChild(row);
            });

        } catch (error) {
            console.error("Dashboard fetch error:", error);
            statusBadge.innerText = "❌ Sync Offline / Error Parsing";
            statusBadge.className = "status-badge";
        }
    }

    // Run immediately on page load
    fetchWeatherData();

    // Auto-refresh the page view every 20 seconds to match up with Pico's uploads
    setInterval(fetchWeatherData, 20000);
</script>

</body>
</html>

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;

    align-items: center; justify-content: center; gap: 24px;
    background: #6e28d9; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h1 { margin: 0 0 8px; font-size: 2rem; }

  button {
    font-size: 1.5rem; font-weight: 700; padding: 20px 40px;
    border: none; border-radius: 14px; cursor: pointer;
    background: #fff; color: #6e28d9; box-shadow: 0 4px 14px rgba(0,0,0,.25);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.3); }
  button:active { transform: scale(.96); }
  #msg { min-height: 1.2em; color: #ffd2cc; }
</style>

      var a = new Audio(SOUNDS[name]);
      a.onerror = function () { document.getElementById("msg").textContent = "Error loading " + name; };

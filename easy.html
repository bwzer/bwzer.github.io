<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 20px;
    background: #6e28d9; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h1 { margin: 0; font-size: 2rem; }
  .btns { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  button {
    font-size: 1.5rem; font-weight: 700; padding: 20px 40px;
    border: none; border-radius: 14px; cursor: pointer;
    background: #fff; color: #6e28d9; box-shadow: 0 4px 14px rgba(0,0,0,.25);
    transition: transform .08s ease, background .15s ease;
  }
  button:hover { transform: translateY(-2px); }
  button:active { transform: scale(.96); }
  button.playing { background: #2ecc71; color: #fff; }
  #msg { min-height: 1.4em; font-size: 1.1rem; color: #ffd2cc; }
  #ver { position: fixed; top: 8px; right: 12px; font-size: .8rem; opacity: .7; }
</style>

  <div class="btns">
    <button id="slapBtn">Slap</button>
    <button id="bellBtn">Handbell</button>
  </div>
  <div id="msg"></div>

  <script>
    function play(id, label, btn) {
      var a = document.getElementById(id);
      var msg = document.getElementById("msg");
      msg.textContent = "";
      a.currentTime = 0;
      var p = a.play();
      if (p && p.then) {
        p.then(function () {
          msg.textContent = "Playing " + label;
          btn.classList.add("playing");
          setTimeout(function () { btn.classList.remove("playing"); }, 500);
        }, function (e) {
          msg.textContent = "Blocked: " + (e.name || e);
        });
      }
    }
    document.getElementById("slapBtn").addEventListener("click", function () { play("slapAudio", "Slap", this); });
    document.getElementById("bellBtn").addEventListener("click", function () { play("bellAudio", "Handbell", this); });

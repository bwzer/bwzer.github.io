    var ctx = null, buffers = {};

    function ensureCtx() {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") ctx.resume();
      return ctx;
    }

    function b64ToArrayBuffer(b64) {
      var bin = atob(b64), ab = new ArrayBuffer(bin.length), v = new Uint8Array(ab);
      for (var i = 0; i < bin.length; i++) v[i] = bin.charCodeAt(i);
      return ab;
    }

    function play(name, btn) {
      var msg = document.getElementById("msg");
      msg.textContent = "";
      var c = ensureCtx();
      var start = function (buffer) {
        var src = c.createBufferSource();
        src.buffer = buffer;
        src.connect(c.destination);
        src.start();
        btn.classList.add("playing");
        setTimeout(function () { btn.classList.remove("playing"); }, 400);
      };
      if (buffers[name]) { start(buffers[name]); return; }
      var b64 = DATA[name].split(",")[1];
      c.decodeAudioData(b64ToArrayBuffer(b64), function (buffer) {
        buffers[name] = buffer;
        start(buffer);
      }, function (err) {
        msg.textContent = "Decode failed for " + name + ": " + (err && err.message ? err.message : err);
      });
